<text x="516" y="154" font-size="20" font-weight="600" fill="#183f52" text-anchor="middle">k conical ends</text>
<text x="516" y="193" font-size="17" font-weight="400" fill="#183f52" text-anchor="middle">genus</text>
<text x="516" y="220" font-size="21" font-weight="600" fill="#183f52" text-anchor="middle">(k − 1)(m − 1)</text>
<text x="516" y="261" font-size="15" font-weight="400" fill="#183f52" text-anchor="middle">limit: kP as m → ∞</text>
<text x="28" y="335" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">The drawn bridge count is illustrative, not an existence threshold.</text>
<text x="28" y="360" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">Flat sheets represent the gluing input, not the final conical ends.</text>
<text x="28" y="387" font-size="15" font-weight="600" fill="#21667f" text-anchor="start">SCHEMATIC • plane stacking and topological counts</text>
