<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title description">
<title id="title">Drugan&#x27;s immersed shrinking spheres: topology schematic</title>
<desc id="description">A smooth sphere domain maps to an immersed image. Two generic local sheets illustrate self-intersection. No solved meridian or exact Drugan surface is represented.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#21667f"/></marker></defs>
<rect width="640" height="410" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183f52" stroke-linejoin="round" stroke-linecap="round">
<text x="28" y="36" font-size="23" font-weight="600" text-anchor="start" fill="#183f52">Drugan’s immersed shrinking spheres</text>
<text x="28" y="64" font-size="16" font-weight="400" text-anchor="start" fill="#6a8793">Topology schematic • existence by rotational shooting</text>
<text x="158" y="112" font-size="18" font-weight="400" text-anchor="middle" fill="#183f52">Smooth domain S²</text>
<text x="466" y="112" font-size="18" font-weight="400" text-anchor="middle" fill="#183f52">Two local image sheets</text>
<ellipse cx="158" cy="201" rx="76" ry="76" stroke="#21667f" stroke-width="2" fill="#e5eff3" />
<ellipse cx="158" cy="201" rx="76" ry="21.28" stroke="#21667f" stroke-width="1.3" fill="none" stroke-dasharray="4 4"/>
<ellipse cx="158" cy="201" rx="22.8" ry="76" stroke="#21667f" stroke-width="1.3" fill="none" />
<ellipse cx="126" cy="190" rx="15" ry="11" stroke="#21667f" stroke-width="2.5" fill="#c8e0e9" />
<ellipse cx="187" cy="211" rx="15" ry="11" stroke="#6a8793" stroke-width="2.5" fill="#d8e1e6" />
<path d="M259 201L334 201" stroke="#21667f" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<text x="297" y="184" font-size="22" font-weight="400" text-anchor="middle" fill="#183f52">X</text>
<polyline points="369.00,172.00 477.00,150.00 565.00,231.00 452.00,254.00 369.00,172.00" stroke="#21667f" stroke-width="2" opacity="0.95" fill="#dce9ef" />
<polyline points="394.00,245.00 441.00,137.00 545.00,177.00 497.00,280.00 394.00,245.00" stroke="#6a8793" stroke-width="2" opacity="0.85" fill="#e6edf0" />
<polyline points="416.00,195.00 518.00,222.00" stroke="#a9572f" stroke-width="3.4" opacity="1" fill="none" />
<text x="158" y="300" font-size="15" font-weight="400" text-anchor="middle" fill="#183f52">Distinct patches in the domain</text>
<text x="473" y="300" font-size="15" font-weight="400" text-anchor="middle" fill="#183f52">Their images can meet</text>
<text x="28" y="337" font-size="16" font-weight="400" text-anchor="start" fill="#183f52">The domain remains smooth at an image self-intersection.</text>
<text x="28" y="364" font-size="16" font-weight="400" text-anchor="start" fill="#183f52">No computed Drugan meridian is represented.</text>
<text x="28" y="393" font-size="15" font-weight="600" text-anchor="start" fill="#21667f">SCHEMATIC • not a solved surface</text>
</g></svg>
