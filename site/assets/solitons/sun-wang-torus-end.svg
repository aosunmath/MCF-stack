<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Torus sections along one translator end</title>
<desc id="desc">Two schematic toroidal cross-sections at increasing height illustrate square-root growth along a single end of a three-dimensional translator in four-dimensional Euclidean space. The high-height slice is square root of z times a normal graph over an Angenent torus with an unknown correction tending to zero. The ring icons are topological schematics, not computed Angenent tori or exact translator geometry.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21667f"/></marker></defs>
<rect width="640" height="410" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="34" font-size="21" text-anchor="start" font-weight="bold" fill="#183f52">Torus sections along one translator end</text>
<text x="26" y="62" font-size="16" text-anchor="start" font-weight="normal" fill="#183f52">Three-dimensional translator in R⁴; horizontal slices lie in R³</text>
<text x="320" y="104" font-size="18" text-anchor="middle" font-weight="normal" fill="#183f52">slice(z) = √z [S + uν],    u → 0</text><text x="166" y="146" font-size="16" text-anchor="middle" font-weight="normal" fill="#183f52">Toroidal cross-section</text><text x="469" y="146" font-size="16" text-anchor="middle" font-weight="normal" fill="#183f52">Same end, higher slice</text><ellipse cx="166" cy="225" rx="85" ry="47.6" fill="#dcecf1" stroke="#21667f" stroke-width="2.5"/><ellipse cx="166" cy="220.75" rx="45.900000000000006" ry="17.0" fill="#f7fafb" stroke="#21667f" stroke-width="2.5"/><path d="M 94.60000000000001 213.1 C 116.7 173.15, 215.3 173.15, 237.39999999999998 213.1" fill="none" stroke="#21667f" stroke-width="1"/><ellipse cx="469" cy="225" rx="113" ry="63.28000000000001" fill="#dcecf1" stroke="#21667f" stroke-width="2.5"/><ellipse cx="469" cy="219.35" rx="61.02" ry="22.6" fill="#f7fafb" stroke="#21667f" stroke-width="2.5"/><path d="M 374.08 209.18 C 403.46000000000004 156.07, 534.54 156.07, 563.92 209.18" fill="none" stroke="#21667f" stroke-width="1"/><line x1="274" y1="225" x2="340" y2="225" stroke="#21667f" stroke-width="2" marker-end="url(#arrow)"/><text x="307" y="202" font-size="15" text-anchor="middle" font-weight="normal" fill="#183f52">√z growth</text><text x="166" y="307" font-size="17" text-anchor="middle" font-weight="normal" fill="#183f52">height z₁</text><text x="469" y="307" font-size="17" text-anchor="middle" font-weight="normal" fill="#183f52">height z₂ &gt; z₁</text><text x="320" y="343" font-size="16" text-anchor="middle" font-weight="normal" fill="#183f52">One end: T² × [z₀, ∞); correction u is unknown</text>
<line x1="26" y1="362" x2="614" y2="362" stroke="#c5d8df" stroke-width="1"/>
<text x="26" y="388" font-size="15" text-anchor="start" font-weight="normal" fill="#183f52">Schematic auxiliary cross-sections; no translator is computed.</text>
</g></svg>
