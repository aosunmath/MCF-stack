<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title description">
<title id="title">Buzano--Nguyen--Schulz shrinkers: symmetry and quantified end statements</title>
<desc id="description">The diagram shows only the three horizontal half-turn axes for the dihedral symmetry of the genus-two case, together with the vertical axis. It does not plot a self-shrinker. The family exists for all positive genera, is noncompact with at least one conical end, and is proved to have exactly one end only for sufficiently large genus. The displayed Gaussian-area bound is rigorous, not a simulation value.</desc>
