<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title description">
<title id="title">Drugan--Nguyen variational shrinking tori: existence schematic</title>
<desc id="description">A generic closed curve in the weighted half-plane illustrates the orbit space. No numerical geodesic is shown. The torus on the right is a topology diagram for dimension two, not a computed shrinker. The construction proves entropy below two in every dimension n at least two, and is not identified with Angenent&#x27;s shooting profile.</desc>
