<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">High-genus sections along one translator end</title>
<desc id="desc">Two topological diagrams of a connected doubled-sphere cross-section at different heights illustrate the single end of a three-dimensional translator in Euclidean four-space. Cross-sectional genus is 2m minus 1 for sufficiently large m. The dots are symbolic repeated bridge sites and do not fix m. Growth is square root of height with an unknown normal correction. Neither the input shrinker nor the resulting translator is computed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21667f"/></marker></defs>
<rect width="640" height="410" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="34" font-size="21" text-anchor="start" font-weight="bold" fill="#183f52">High-genus sections along one translator end</text>
<text x="26" y="62" font-size="16" text-anchor="start" font-weight="normal" fill="#183f52">Three-dimensional translator in R⁴; horizontal slices lie in R³</text>
