  <title id="title">One-sided cone expanders: a schematic slice</title>
  <desc id="description">A cone bounds the shaded selected side Omega. Three schematic homothetic leaves move into Omega as time increases. The drawn curves are not computed self-expanders and do not assert a universal topology.</desc>
