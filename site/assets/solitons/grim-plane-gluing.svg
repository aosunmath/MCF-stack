<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Trident: singular gluing input</title>
<desc id="desc">A grim-reaper cross-section and a vertical-plane section intersect. Beside it, repeated marked neck sites along the intersection line illustrate the periodic gluing construction. These are singular input and gluing-location diagrams, not the exact smooth trident surface.</desc>
