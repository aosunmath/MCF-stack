<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Spherical-doubling shrinker in R³</title>
<desc id="desc">A schematic of two nearby sphere sheets with symbolic bridge sites on two latitude circles, beside a local catenoidal bridge model. The Kapouleas–McGrath subfamily has two m bridges and genus two m minus one for sufficiently large m. This is a construction diagram, not an exact or numerically computed self-shrinker; the number of drawn dots does not specify a permitted construction parameter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21667f"/></marker></defs>
