<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Finite genus: singular gluing input</title>
<desc id="desc">Schematic meridian profiles of a bowl and a winglike translator meet at a marked point. Rotation produces the intersection circle, shown separately with many neck locations. No displayed profile is an exact or numerically computed translator, and no particular genus is asserted by the number of dots.</desc>
