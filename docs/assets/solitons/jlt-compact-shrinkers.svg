<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">Compact periodic Lagrangian shrinkers</title><desc id="desc">Construction diagram · no ODE closing problem is solved in this picture</desc><rect width="960" height="610" fill="#f7fafb" /><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="25" fill="#183f52" font-weight="600">Compact periodic Lagrangian shrinkers</text><text x="30" y="70" font-size="15" fill="#183f52">Construction diagram · no ODE closing problem is solved in this picture</text><rect x="45" y="130" width="400" height="130" rx="16" fill="#e6f0f4" stroke="#438ba9" /><text x="70" y="172" font-size="23" fill="#183f52">ODE orbit</text><text x="70" y="216" font-size="20" fill="#183f52">u(s), phases φⱼ(s)</text><rect x="505" y="130" width="400" height="130" rx="16" fill="#e6f0f4" stroke="#438ba9" /><text x="530" y="172" font-size="23" fill="#183f52">Phase closing</text><text x="530" y="216" font-size="20" fill="#183f52">γⱼ / π are rational</text><rect x="45" y="330" width="400" height="130" rx="16" fill="#e6f0f4" stroke="#438ba9" /><text x="70" y="372" font-size="23" fill="#183f52">Moving quadric</text><text x="70" y="416" font-size="20" fill="#183f52">x ∈ Sⁿ⁻¹; wⱼ(s) ∈ C</text><rect x="505" y="330" width="400" height="130" rx="16" fill="#e6f0f4" stroke="#438ba9" /><text x="530" y="372" font-size="23" fill="#183f52">Compact immersion</text><text x="530" y="416" font-size="20" fill="#183f52">Sⁿ⁻¹ × S¹ → Cⁿ</text><text x="460" y="203" font-size="30" fill="#183f52">→</text><text x="460" y="403" font-size="30" fill="#183f52">→</text><text x="30" y="548" font-size="17" fill="#183f52">The domain is a torus when n = 2. Embeddedness is not inferred.</text><text x="30" y="576" font-size="16" fill="#183f52">Constant-radius cases are excluded from this catalogue entry.</text></g></svg>