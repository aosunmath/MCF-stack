<title id="title">A closed shrinking curve times a shrinking circle in four-space</title>
<desc id="description">The first factor is the numerical Abresch--Langer curve with rotation index 2 and three curvature periods. The second is the exact circle of radius square root of two. Their product is a two-dimensional immersed Lagrangian shrinker in four-space. The diagram shows factors, not a surface in three-space.</desc>
