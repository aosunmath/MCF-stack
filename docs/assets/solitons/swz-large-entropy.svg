<text x="28" y="64" font-size="15" font-weight="400" fill="#6a8793" text-anchor="start">Gaussian min–max widths in dimensions 2 ≤ n ≤ 6</text>
<path d="M68 283L355 283" fill="none" stroke="#21667f" stroke-width="2" marker-end="url(#arrow)"/>
