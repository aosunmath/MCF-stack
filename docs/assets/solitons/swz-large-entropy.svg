<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title description">
<title id="title">Sun–Wang–Zhou shrinkers of unbounded entropy</title>
<desc id="description">A qualitative increasing curve illustrates the growth of Gaussian widths with the min-max parameter k. For dimensions two through six the constructed shrinker has entropy equal to the kth width, with growth comparable to k to the power one over n plus one and Gaussian Morse index at most k. No numerical entropy values or shapes are plotted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#21667f"/></marker></defs>
<rect width="640" height="410" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183f52" stroke-linejoin="round" stroke-linecap="round">
