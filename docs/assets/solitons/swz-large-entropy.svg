<text x="214" y="310" font-size="13" font-weight="400" fill="#183f52" text-anchor="middle">Qualitative growth; no numeric scale</text>
<rect x="392" y="118" width="220" height="172" rx="10" fill="#e5eff3"/>
<text x="502" y="153" font-size="23" font-weight="600" text-anchor="middle">λ(Σ<tspan baseline-shift="sub" font-size="14">k</tspan>) = ω<tspan baseline-shift="sub" font-size="14">k</tspan></text>
<text x="502" y="191" font-size="23" text-anchor="middle">ω<tspan baseline-shift="sub" font-size="14">k</tspan> ≍ k<tspan baseline-shift="super" font-size="13">1/(n+1)</tspan></text>
<text x="502" y="231" font-size="17" font-weight="400" fill="#183f52" text-anchor="middle">Gaussian index ≤ k</text>
<text x="502" y="266" font-size="16" font-weight="400" fill="#183f52" text-anchor="middle">entropy is unbounded</text>
<text x="28" y="335" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">Genus, compactness, and ends are not prescribed by this theorem.</text>
<text x="28" y="360" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">The curve is a growth diagram, not computed width data.</text>
<text x="28" y="387" font-size="15" font-weight="600" fill="#21667f" text-anchor="start">SCHEMATIC • proved growth order and index bound</text>
</g></svg>
