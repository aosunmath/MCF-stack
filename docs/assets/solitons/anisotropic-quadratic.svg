<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Higher-dimensional convex translators</title>
<desc id="desc">Schematic anisotropic contours are rescaled toward circular contours of a quadratic blow-down on its active-coordinate subspace. The theorem allows scale-dependent rotations; this is not an exact translator or a fixed-axis convergence claim.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21667f"/></marker>
 <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#21667f"/></marker>
</defs>
<rect width="640" height="410" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="34" font-size="21" text-anchor="start" font-weight="bold" fill="#183f52">Higher-dimensional convex translators</text>
<text x="26" y="62" font-size="16" text-anchor="start" font-weight="normal" fill="#183f52">Contour diagrams only; no translator surface is plotted</text>
<text x="158" y="109" font-size="17" text-anchor="middle" font-weight="normal" fill="#183f52">Anisotropy (schematic)</text><text x="461" y="109" font-size="17" text-anchor="middle" font-weight="normal" fill="#183f52">Quadratic blow-down</text><line x1="60" y1="215" x2="255" y2="215" stroke="#21667f" stroke-width="1" marker-end="url(#arrow)"/><line x1="158" y1="295" x2="158" y2="133" stroke="#21667f" stroke-width="1" marker-end="url(#arrow)"/><line x1="366" y1="215" x2="558" y2="215" stroke="#21667f" stroke-width="1" marker-end="url(#arrow)"/><line x1="461" y1="296" x2="461" y2="132" stroke="#21667f" stroke-width="1" marker-end="url(#arrow)"/><ellipse cx="158" cy="215" rx="85" ry="47" fill="none" stroke="#21667f" stroke-width="2"/><ellipse cx="461" cy="215" rx="69" ry="69" fill="none" stroke="#21667f" stroke-width="2"/><ellipse cx="158" cy="215" rx="61.199999999999996" ry="33.839999999999996" fill="none" stroke="#21667f" stroke-width="2"/><ellipse cx="461" cy="215" rx="49.68" ry="49.68" fill="none" stroke="#21667f" stroke-width="2"/><ellipse cx="158" cy="215" rx="36.55" ry="20.21" fill="none" stroke="#21667f" stroke-width="2"/><ellipse cx="461" cy="215" rx="29.669999999999998" ry="29.669999999999998" fill="none" stroke="#21667f" stroke-width="2"/><line x1="274" y1="215" x2="345" y2="215" stroke="#21667f" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="193" font-size="16" text-anchor="middle" font-weight="normal" fill="#183f52">h → ∞</text><text x="158" y="319" font-size="16" text-anchor="middle" font-weight="normal" fill="#183f52">Nonrotational graph</text><text x="461" y="319" font-size="16" text-anchor="middle" font-weight="normal" fill="#183f52">Active-coordinate slice</text><text x="320" y="348" font-size="17" text-anchor="middle" font-weight="normal" fill="#183f52">Q(x) = |x′|² / [2(k − 1)],     2 ≤ k ≤ n</text>
<line x1="26" y1="362" x2="614" y2="362" stroke="#c5d8df" stroke-width="1"/>
<text x="26" y="388" font-size="15" text-anchor="start" font-weight="normal" fill="#183f52">Blow-down may require rotations depending on the scale.</text>
</g>
</svg>
