<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="title">Three limits of a degenerate neckpinch</title>
  <desc id="description">Three panels distinguish the cylindrical parabolic limit, the bowl limit after rescaling at the tip, and an intermediate anisotropic limiting profile. The first two drawings are schematic; the third plots r=sqrt(2+x^3), the limit for n=2, m=3 and K=1. No exact full evolving compact surface is drawn.</desc>
  <rect width="640" height="410" fill="#f7fafb" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" stroke="#21667f" stroke-width="0" fill="#21667f" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <text x="24" y="33" fill="#183f52" font-size="23" font-weight="650" text-anchor="start">Three scales near a degenerate neckpinch</text>
  <text x="24" y="59" fill="#526b77" font-size="15" font-weight="400" text-anchor="start">Limits of the same type-II singularity · not an exact full flow</text>
