<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title description">
<title id="title">Ilmanen–White two-ended shrinkers: topology schematic</title>
<desc id="description">Two schematic sheets connected by three neck symbols illustrate the genus-two, two-ended topology. The complete ends are conical; these flat patches are not their actual geometry. The theorem constructs every genus h at least two, with h plus one equatorial neck circles, and the large-genus limit is a double plane.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#21667f"/></marker></defs>
<rect width="640" height="410" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183f52" stroke-linejoin="round" stroke-linecap="round">
<text x="28" y="36" font-size="22" font-weight="600" fill="#183f52" text-anchor="start">Ilmanen–White two-ended shrinkers</text>
<text x="28" y="64" font-size="15" font-weight="400" fill="#6a8793" text-anchor="start">Every genus h ≥ 2; two asymptotically conical ends</text>
<polyline points="54.000,235.000 159.000,202.000 354.000,235.000 249.000,268.000 54.000,235.000" fill="#e5eff3" stroke="#6a8793" stroke-width="1.4" opacity="1"/>
<path d="M111 162 C116.85 195.0 116.85 195.0 111 228 L129 228 C123.15 195.0 123.15 195.0 129 162 Z" fill="#f7fafb" stroke="#a9572f" stroke-width="1.7"/>
