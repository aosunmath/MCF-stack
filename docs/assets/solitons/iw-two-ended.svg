<ellipse cx="204" cy="162" rx="9" ry="2.8" fill="none" stroke="#a9572f" stroke-width="1.3"/>
<ellipse cx="204" cy="228" rx="9" ry="2.8" fill="none" stroke="#a9572f" stroke-width="1.3"/>
<path d="M279 162 C284.85 195.0 284.85 195.0 279 228 L297 228 C291.15 195.0 291.15 195.0 297 162 Z" fill="#f7fafb" stroke="#a9572f" stroke-width="1.7"/>
<ellipse cx="288" cy="162" rx="9" ry="2.8" fill="none" stroke="#a9572f" stroke-width="1.3"/>
<ellipse cx="288" cy="228" rx="9" ry="2.8" fill="none" stroke="#a9572f" stroke-width="1.3"/>
<polyline points="54.000,154.000 159.000,121.000 354.000,154.000 249.000,187.000 54.000,154.000" fill="#edf4f6" stroke="#6a8793" stroke-width="1.4" opacity="1"/>
<ellipse cx="120" cy="162" rx="9" ry="3" fill="none" stroke="#a9572f" stroke-width="1.7"/>
<ellipse cx="204" cy="162" rx="9" ry="3" fill="none" stroke="#a9572f" stroke-width="1.7"/>
<ellipse cx="288" cy="162" rx="9" ry="3" fill="none" stroke="#a9572f" stroke-width="1.7"/>
<text x="204" y="290" font-size="16" font-weight="400" fill="#183f52" text-anchor="middle">Topology symbols: h + 1 necks</text>
<path d="M382 195L439 195" fill="none" stroke="#21667f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="172" font-size="15" font-weight="400" fill="#183f52" text-anchor="middle">h → ∞</text>
<polyline points="454.000,196.000 478.000,173.000 592.000,196.000 568.000,219.000 454.000,196.000" fill="#e5eff3" stroke="#6a8793" stroke-width="1.4" opacity="1"/>
<text x="523" y="242" font-size="23" font-weight="600" fill="#183f52" text-anchor="middle">2P</text>
<text x="28" y="335" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">Three neck symbols illustrate h = 2; geometry is schematic.</text>
<text x="28" y="360" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">The large-genus convergence is to a multiplicity-two plane.</text>
<text x="28" y="387" font-size="15" font-weight="600" fill="#21667f" text-anchor="start">SCHEMATIC • topology and limiting multiplicity</text>
</g></svg>
