<title id="title">Ketover Platonic shrinkers: sweepout symmetry and genus</title>
<desc id="description">Wireframes indicate the five Platonic solids used to organize doubling sweepouts. A solid with f faces leads to a shrinker of genus f minus one. These wireframes are not shrinker meshes; compactness and the number of ends of the min-max limits remain unspecified in the construction.</desc>
