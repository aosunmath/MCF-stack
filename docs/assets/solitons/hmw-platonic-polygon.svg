<text x="177" y="302" font-size="17" font-weight="400" fill="#183f52" text-anchor="middle">6 rays → genus 5</text>
<text x="475" y="302" font-size="17" font-weight="400" fill="#183f52" text-anchor="middle">n rays → genus n − 1</text>
<text x="28" y="335" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">The constructed shrinker avoids Q; Q is not the surface.</text>
<text x="28" y="360" font-size="15" font-weight="400" fill="#183f52" text-anchor="start">Compactness and exact end counts are not fixed in general.</text>
<text x="28" y="387" font-size="15" font-weight="600" fill="#21667f" text-anchor="start">SCHEMATIC • symmetry data, not a computed shrinker</text>
