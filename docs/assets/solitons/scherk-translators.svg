  <text x="24" y="367" fill="#526b77" font-size="14" font-weight="400" text-anchor="start">Downward source convention; reflect height for upward translation.</text>
  <text x="24" y="390" fill="#526b77" font-size="14" font-weight="400" text-anchor="start">Orange lines are reflection axes. Repeating pieces gives infinite genus.</text>
